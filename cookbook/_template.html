<!--
  Template for new cookbook recipe pages. Not linked from anywhere; copy it to
  a new file (e.g. cookbook/my_recipe.html), fill in the placeholders, add a
  row to cookbook.html, and delete this comment block.

  Scaling recipes (servings slider): give renderRecipe() a `servings` object
  and write ingredient items as { name, quantity, unit } — quantity/unit are
  scaled automatically. Use unit: '' for count items with no unit.

  Fixed recipes (no slider, e.g. a fixed pan size): pass `servings: null` and
  write ingredient items as { text: '...' } — rendered as-is, unscaled.

  Ingredients can be a single list, or split into subsections (see the
  `sections` array) each with its own <h3> + <ul id="...">.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recipe Name – Contant Cookbook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="../css/general_style.css">
  <link rel="stylesheet" type="text/css" href="../css/cookbook.css">
  <script>
    (function () {
      try {
        if (localStorage.getItem('cookbook-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header>
    <div class="header-top">
      <div id="title">Contant Cookbook</div>
      <button type="button" id="darkModeToggle" class="theme-toggle" aria-label="Switch to dark mode">🌙</button>
    </div>
    <ul class="horizontal-list" id="nav-bar">
      <li><a href="../index.html">Home</a></li>
      <li><a href="../cookbook.html">Cookbook</a></li>
    </ul>
  </header>

  <main>
    <h1>Recipe Name</h1>

    <label id="servingsLabel" hidden>
      Servings:
      <span id="servingCount"></span>
      <input type="range" id="servingSlider" min="1" max="20" value="4">
    </label>

    <h2>Ingredients</h2>
    <div class="ingredients">
      <ul id="ingredientList"></ul>
    </div>

    <h2>Instructions</h2>
    <div class="instructions">
      <ol>
        <li>Step one.</li>
        <li>Step two.</li>
      </ol>
    </div>

    <h2>Notes</h2>
    <p>Optional notes about the recipe.</p>
  </main>

  <script src="../js/theme.js"></script>
  <script src="../js/recipe.js"></script>
  <script>
    renderRecipe({
      servings: { base: 4, min: 1, max: 20 },
      sections: [
        {
          listId: 'ingredientList',
          items: [
            { name: 'ingredient name', quantity: 1, unit: 'cup' },
            { name: 'salt and pepper', quantity: null, unit: '' }
          ]
        }
      ]
    });
  </script>
</body>
</html>
