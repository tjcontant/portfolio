<!--
  Template for new blog posts. Not linked from anywhere; copy it to a new file
  (e.g. blog/my_post.html), fill in the placeholders, add an entry to blog.html
  (featured card + archive list), and delete this comment block.

  blog/field_guide.html shows every element a post can use (math, code blocks,
  tables, figures, callouts, theorems, footnotes, collapsible sections) — copy
  the markup you need from there.

  Reading time, the table of contents, and heading "#" links are generated by
  js/blog.js. Delete the KaTeX tags in <head> if the post has no math.
-->
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Post Title – Tristan Contant</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="One-sentence summary of the post.">
	<link rel="stylesheet" type="text/css" href="../css/general_style.css">
	<link rel="stylesheet" type="text/css" href="../css/blog.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
	<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
	<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"
		onload="renderMathInElement(document.querySelector('.post-body'), {delimiters: [{left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}]})"></script>
	<script>
		(function () {
			try {
				if (localStorage.getItem('cookbook-theme') === 'dark') {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			} catch (e) { }
		})();
	</script>
</head>

<body>
	<div class="reading-progress" aria-hidden="true"></div>

	<header>
		<div class="header-top">
			<div id="title">Tristan's Blog</div>
			<button type="button" id="darkModeToggle" class="theme-toggle"
				aria-label="Switch to dark mode">Dark</button>
		</div>
		<ul class="horizontal-list" id="nav-bar">
			<li><a href="../index.html">Home</a></li>
			<li><a href="../cookbook.html">Cookbook</a></li>
			<li><a href="../blog.html">Blog</a></li>
		</ul>
	</header>

	<main>
		<article>
			<a class="back-link" href="../blog.html">← All posts</a>

			<header class="post-header">
				<h1>Post Title</h1>
				<p class="dek">Optional one-line subtitle.</p>
				<div class="post-meta">
					<time class="monospace" datetime="YYYY-MM-DD">YYYY-MM-DD</time>
					<span aria-hidden="true">·</span>
					<span id="readingTime"></span>
					<ul class="tag-list">
						<li class="tag">tag</li>
					</ul>
				</div>
			</header>

			<nav class="card toc" aria-label="Table of contents">
				<p class="toc-title">Contents</p>
				<ol></ol>
			</nav>

			<div class="post-body">
				<p>Opening paragraph.</p>

				<h2>First Section</h2>
				<p>Body text.</p>
			</div>

			<footer class="post-footer">
				<ul class="tag-list">
					<li class="tag">tag</li>
				</ul>
				<nav class="post-nav" aria-label="More posts">
					<a class="card prev" href="previous_post.html">
						<span class="post-nav-label">← Previous</span>
						<span class="post-nav-title">Previous Post Title</span>
					</a>
					<a class="card next" href="next_post.html">
						<span class="post-nav-label">Next →</span>
						<span class="post-nav-title">Next Post Title</span>
					</a>
				</nav>
				<p><a href="#">Back to top ↑</a></p>
			</footer>
		</article>
	</main>

	<script src="../js/theme.js"></script>
	<script src="../js/blog.js"></script>
</body>

</html>
