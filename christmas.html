<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a22">
<title>Tristan's Christmas Wish List 🎄</title>
<meta name="description" content="Tristan's Christmas wish list — tap the present to open it!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Caveat:wght@600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0f2a22; --night2:#173d31; --red:#c8323b; --red-dark:#9c2129;
    --gold:#f2c14e; --cream:#fff8ec; --ink:#2b1d14; --muted:#7a6656; --green:#2f7a52;
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--night)}
  body{
    font-family:"Nunito",system-ui,-apple-system,sans-serif;
    background:var(--night) radial-gradient(120% 900px at 50% 0%, var(--night2), var(--night) 70%) no-repeat;
    color:var(--cream); min-height:100vh; overflow-x:hidden;
  }
  #snow{position:fixed;inset:0;pointer-events:none;z-index:0}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

  /* ---------- LANDING ---------- */
  .landing{
    position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
    transition:opacity .6s ease, transform .6s ease;
  }
  .landing.gone{opacity:0;transform:scale(.96);pointer-events:none;position:absolute;inset:0}
  .eyebrow{font-family:"Caveat",cursive;font-size:1.7rem;color:var(--gold);transform:rotate(-3deg)}
  h1{font-family:"Fraunces",serif;font-weight:800;font-size:clamp(2.4rem,11vw,4.2rem);line-height:1;margin:.25em 0 .3em;letter-spacing:-.01em}
  h1 span{color:var(--red);text-shadow:0 2px 0 #00000033}
  .countdown{display:flex;gap:10px;justify-content:center;margin:6px 0 34px}
  .cd{background:#ffffff14;border:1px solid #ffffff22;border-radius:14px;padding:8px 10px;min-width:62px}
  .cd b{display:block;font-family:"Fraunces",serif;font-size:1.6rem}
  .cd small{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;opacity:.75}

  /* the present */
  .gift{position:relative;width:200px;height:190px;border:none;background:none;margin:10px auto 18px;animation:wiggle 2.6s ease-in-out infinite}
  .gift .box{position:absolute;bottom:0;left:10px;width:180px;height:130px;background:var(--red);border-radius:10px;box-shadow:inset 0 -12px 0 #0000001f,0 18px 30px #0006}
  .gift .lid{position:absolute;top:28px;left:0;width:200px;height:42px;background:var(--red-dark);border-radius:10px;box-shadow:0 6px 0 #00000026;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
  .gift .ribbon-v{position:absolute;bottom:0;left:50%;width:30px;height:130px;margin-left:-15px;background:var(--gold)}
  .gift .lid .ribbon-v{height:42px}
  .gift .bow{position:absolute;top:-30px;left:50%;width:90px;height:40px;margin-left:-45px}
  .gift .bow::before,.gift .bow::after{content:"";position:absolute;top:4px;width:42px;height:34px;border:10px solid var(--gold);border-radius:50% 50% 10% 50%}
  .gift .bow::before{left:0;transform:rotate(-20deg)}
  .gift .bow::after{right:0;transform:rotate(20deg) scaleX(-1)}
  .gift.open{animation:none}
  .gift.open .lid{transform:translate(40px,-150px) rotate(35deg)}
  @keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-6deg)}88%{transform:rotate(6deg)}92%{transform:rotate(-4deg)}96%{transform:rotate(3deg)}}
  .tap{font-family:"Caveat",cursive;font-size:1.6rem;color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  .from{margin-top:26px;font-size:.95rem;opacity:.7}

  /* ---------- LIST ---------- */
  .list{position:relative;z-index:1;display:none;max-width:560px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 60px)}
  .list.show{display:block;animation:rise .7s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(30px)}}
  .list header{text-align:center;margin-bottom:22px}
  .list h2{font-family:"Fraunces",serif;font-size:2.1rem;line-height:1.1;margin-top:4px}
  .list header p{opacity:.8;margin-top:8px;line-height:1.5}
  .toolbar{display:flex;gap:10px;justify-content:center;margin:18px 0 26px;flex-wrap:wrap}
  .pill{border:none;border-radius:999px;padding:12px 18px;font-weight:800;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #b88c22;transition:transform .1s}
  .pill:active{transform:translateY(3px);box-shadow:0 1px 0 #b88c22}
  .pill.ghost{background:#ffffff18;color:var(--cream);box-shadow:none;border:1px solid #ffffff33}

  .card{background:var(--cream);color:var(--ink);border-radius:var(--radius);overflow:hidden;margin-bottom:26px;
    box-shadow:0 16px 40px #0007;position:relative;transform-origin:50% 0;
    opacity:0;transform:translateY(30px) rotate(-1deg);transition:opacity .6s ease, transform .6s ease, box-shadow .3s}
  .card.in{opacity:1;transform:none}
  .gallery{position:relative;background:#f1e7d6}
  .slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .slides::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:#fff}
  .slide img{width:100%;height:100%;object-fit:contain;display:block}
  .slide .fallback{font-size:5rem;display:none}
  .slide.broken img{display:none}.slide.broken .fallback{display:block}
  .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#0003;transition:all .25s}
  .dots i.on{background:var(--red);width:20px;border-radius:5px}
  .swipe-hint{position:absolute;bottom:28px;right:12px;font-family:"Caveat",cursive;font-size:1.2rem;color:var(--muted);background:#fffc;border-radius:999px;padding:0 10px}

  .body{padding:20px 20px 22px}
  .brand{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--green)}
  .body h3{font-family:"Fraunces",serif;font-size:1.5rem;line-height:1.15;margin:4px 0 8px}
  .price{font-weight:800;font-size:1.15rem}
  .price s{color:var(--muted);font-weight:400;font-size:.95rem;margin-left:6px}
  .note{font-family:"Caveat",cursive;font-size:1.45rem;line-height:1.15;color:var(--red-dark);margin:12px 0 6px}
  .specs{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .specs li{background:#efe3cf;border-radius:10px;padding:6px 10px;font-size:.88rem}
  .specs li b{font-weight:800}
  .actions{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;text-align:center;text-decoration:none;border:none;border-radius:14px;padding:14px 12px;font-weight:800;font-size:1rem}
  .btn.shop{background:var(--green);color:#fff}
    padding:6px 16px;border-radius:10px;background:#fff8ecdd;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}

  footer{text-align:center;opacity:.75;font-size:.95rem;margin-top:10px;line-height:1.6}
  footer .sig{font-family:"Caveat",cursive;font-size:1.6rem;color:var(--gold);opacity:1}

  /* confetti */
  .confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:50;pointer-events:none;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}

  @media (prefers-reduced-motion: reduce){
    .gift,.tap{animation:none}.card{transition:none}
  }
</style>
</head>
<body>
<canvas id="snow"></canvas>

<!-- ===== Landing ===== -->
<section class="landing" id="landing">
  <div class="eyebrow">Ho ho ho, Mom!</div>
  <h1>Tristan's<br><span>Wish List</span></h1>
  <div class="countdown" id="countdown" aria-label="Countdown to Christmas"></div>
  <button class="gift" id="gift" aria-label="Open the present to see the wish list">
    <div class="box"><div class="ribbon-v"></div></div>
    <div class="lid"><div class="ribbon-v"></div><div class="bow"></div></div>
  </button>
  <div class="tap">tap the present to open it ✨</div>
  <p class="from">Christmas 2026</p>
</section>

<!-- ===== List ===== -->
<main class="list" id="list">
  <header>
    <div class="eyebrow">You opened it! 🎉</div>
    <h2>Things I'd love<br>this Christmas</h2>
    <p>Swipe through the photos!</p>
  </header>
  <div class="toolbar">
    <button class="pill" id="rewrap">🎁 Re-wrap</button>
  </div>
  <div id="cards"></div>
  <footer>
    <p>No pressure on any of it — just ideas!</p>
    <p class="sig">Love you, Tristan ❤️</p>
  </footer>
</main>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- countdown ---------- */
function tick(){
  const now = new Date();
  let xmas = new Date(now.getFullYear(), 11, 25);
  if (now > new Date(now.getFullYear(), 11, 26)) xmas = new Date(now.getFullYear()+1, 11, 25);
  let diff = Math.max(0, xmas - now);
  const d = Math.floor(diff/864e5), h = Math.floor(diff/36e5)%24, m = Math.floor(diff/6e4)%60, s = Math.floor(diff/1e3)%60;
  $("#countdown").innerHTML = diff === 0
    ? '<div class="cd"><b>🎄</b><small>Merry Christmas!</small></div>'
    : [[d,"days"],[h,"hrs"],[m,"min"],[s,"sec"]].map(([v,l]) => `<div class="cd"><b>${v}</b><small>${l}</small></div>`).join("");
}
tick(); setInterval(tick, 1000);

/* ---------- build cards ---------- */
$("#cards").innerHTML = ITEMS.map((it, i) => `
  <article class="card" id="card-${it.id}" data-id="${it.id}">
    <div class="gallery">
      <div class="slides">
        ${it.images.map((src, j) => `
          <div class="slide"><img src="${esc(src)}" alt="${esc(it.name)} photo ${j+1}" loading="${i===0 && j===0 ? "eager" : "lazy"}"
               onerror="this.parentElement.classList.add('broken')"><span class="fallback">${it.emoji}</span></div>`).join("")}
      </div>
      ${it.images.length > 1 ? `<div class="dots">${it.images.map((_, j) => `<i class="${j===0?"on":""}"></i>`).join("")}</div><div class="swipe-hint">swipe →</div>` : ""}
    </div>
    <div class="body">
      <div class="brand">${esc(it.brand)}</div>
      <h3>${esc(it.name)}</h3>
      <div class="price">${esc(it.price)}${it.wasPrice ? `<s>${esc(it.wasPrice)}</s>` : ""}</div>
      <p class="note">“${esc(it.note)}”</p>
      <ul class="specs">${it.specs.map(([k,v]) => `<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join("")}</ul>
      <div class="actions">
        <a class="btn shop" href="${esc(it.url)}" target="_blank" rel="noopener">Where to buy ↗</a>
      </div>
    </div>
  </article>`).join("");

/* gallery dots */
document.querySelectorAll(".gallery").forEach(g => {
  const slides = g.querySelector(".slides"), dots = g.querySelectorAll(".dots i"), hint = g.querySelector(".swipe-hint");
  slides.addEventListener("scroll", () => {
    const idx = Math.round(slides.scrollLeft / slides.clientWidth);
    dots.forEach((d, i) => d.classList.toggle("on", i === idx));
    if (hint && slides.scrollLeft > 10) hint.remove();
  }, {passive:true});
});

/* reveal cards as they scroll in */
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } }), {threshold:.12});

/* ---------- open / re-wrap ---------- */
function openGift(){
  $("#gift").classList.add("open");
  confetti(110);
  setTimeout(() => {
    $("#landing").classList.add("gone");
    $("#list").classList.add("show");
    window.scrollTo(0,0);
    document.querySelectorAll(".card").forEach(c => io.observe(c));
  }, reduceMotion ? 0 : 750);
}
$("#gift").addEventListener("click", openGift);
$("#rewrap").addEventListener("click", () => {
  $("#list").classList.remove("show");
  $("#landing").classList.remove("gone");
  $("#gift").classList.remove("open");
  document.querySelectorAll(".card").forEach(c => c.classList.remove("in"));
  window.scrollTo(0,0);
});

/* ---------- confetti ---------- */
function confetti(count, x){
  if (reduceMotion) return;
  const colors = ["#c8323b","#f2c14e","#2f7a52","#fff8ec","#7fb7e8"];
  for (let i = 0; i < count; i++){
    const p = document.createElement("div");
    p.className = "confetti";
    p.style.left = (x != null ? x + (Math.random()-.5)*200 : Math.random()*innerWidth) + "px";
    p.style.background = colors[i % colors.length];
    p.style.setProperty("--dx", (Math.random()-.5)*200 + "px");
    p.style.setProperty("--r", Math.random()*720 + "deg");
    p.style.animationDuration = 1.8 + Math.random()*1.6 + "s";
    p.style.animationDelay = Math.random()*.3 + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

/* ---------- snow ---------- */
(() => {
  const c = $("#snow"), ctx = c.getContext("2d");
  let W, H, flakes = [];
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size(){
    W = innerWidth; H = innerHeight;
    c.width = W*dpr; c.height = H*dpr; c.style.width = W+"px"; c.style.height = H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(120, W*H/9000));
    flakes = Array.from({length:n}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*2.6+.6, s:Math.random()*.6+.25, w:Math.random()*Math.PI*2}));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (const f of flakes){
      f.y += f.s; f.w += .01; f.x += Math.sin(f.w)*.35;
      if (f.y > H+5){ f.y = -5; f.x = Math.random()*W; }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
    if (!reduceMotion) requestAnimationFrame(draw);
  }
  size(); addEventListener("resize", size); draw();
})();
</script>
</body>
</html>
